<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser light scheduler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Light scheduler (GUI)</h1>
  <form id="scheduleForm">
    <label for="onTime">SET light's ON Time:</label>
    <input type="time" id="onTime" name="onTime" required><br><br>

    <label for="offTime">SET light's OFF Time:</label>
    <input type="time" id="offTime" name="offTime" required><br><br>

    <button type="submit">Set Schedule</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
